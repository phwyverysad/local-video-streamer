<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Video Streamer</title>
  <link rel="icon" type="image/png" href="/icon.png">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      background-color: #000000 !important;
      background: #000000 !important;
      color: #ffffff;
      width: 100vw;
      height: 100vh;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      margin: 0 !important;
      padding: 0 !important;
      overflow: hidden !important;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    .player-container {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #000000;
      position: fixed;
      inset: 0;
      overflow: hidden;
    }
    #player-active {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000000;
    }
    .video-wrapper {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000000;
    }
    .video-wrapper video {
      width: 100%;
      height: 100%;
      max-width: 100vw;
      max-height: 100vh;
      max-height: 100dvh;
      object-fit: contain;
      background: #000000;
      border: none;
      outline: none;
      display: block;
    }
    .revoked-box {
      text-align: center;
      padding: 30px 20px;
      max-width: 400px;
      color: #a1a1aa;
    }
    .revoked-icon {
      margin-bottom: 14px;
      display: flex;
      justify-content: center;
    }
    .revoked-title {
      font-size: 18px;
      font-weight: 700;
      color: #f87171;
      margin-bottom: 6px;
    }
    .revoked-desc {
      font-size: 13.5px;
      line-height: 1.5;
      color: #a1a1aa;
    }
    .loading-box {
      text-align: center;
      color: #38bdf8;
    }
    .loading-spinner {
      margin-bottom: 12px;
      display: flex;
      justify-content: center;
    }
    .animate-spin {
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .svg-icon-xl {
      width: 42px;
      height: 42px;
    }
  </style>
</head>
<body>
  <div class="player-container">
    <!-- Active Player State -->
    <div id="player-active" style="display: none;">
      <div class="video-wrapper">
        <video 
          id="video-element" 
          controls 
          playsinline 
          webkit-playsinline="true" 
          preload="auto"
        >
          <source id="video-source" src="" type="video/mp4">
          เบราว์เซอร์ไม่รองรับการเล่นวิดีโอนี้
        </video>
      </div>
    </div>

    <!-- Revoked / Not Found State -->
    <div id="player-revoked" class="revoked-box" style="display: none;">
      <div class="revoked-icon">
        <svg class="svg-icon-xl" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="15" y1="9" x2="9" y2="15"></line>
          <line x1="9" y1="9" x2="15" y2="15"></line>
        </svg>
      </div>
      <h2 class="revoked-title">ไม่พบวิดีโอ</h2>
      <p class="revoked-desc">
        ไฟล์ถูกยกเลิกการแชร์หรือลบแล้ว
      </p>
    </div>

    <!-- Loading State -->
    <div id="player-loading" class="loading-box">
      <div class="loading-spinner">
        <svg class="svg-icon-xl animate-spin" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 1 1-6.219-8.56"></path>
        </svg>
      </div>
      <p style="font-size: 13px; color: #a1a1aa;">กำลังโหลด...</p>
    </div>
  </div>

  <script src="/js/player.js"></script>
</body>
</html>
